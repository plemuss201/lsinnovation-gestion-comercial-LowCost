<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LS Gestión Comercial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23102A43'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='42' font-weight='700' fill='%2300A9B7' text-anchor='middle'%3ELS%3C/text%3E%3C/svg%3E"/>
<style>
:root{--azul:#102A43;--azul-oscuro:#0A192F;--cian:#00A9B7;--cian-oscuro:#087F8C;--gris:#F0F4F8;--texto:#243B53;--suave:#627D98;--rojo:#E12D39;--verde:#27AB83;--sombra:0 4px 12px rgba(16,42,67,.12);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gris);color:var(--texto);min-height:100vh;display:flex}
.sidebar{width:260px;background:var(--azul-oscuro);color:#fff;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100}
.brand{padding:18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.brand-logo img,.brand-logo svg{width:44px;height:44px;object-fit:contain;display:block}
.brand-text h1{font-size:14px;font-weight:700;line-height:1.2}
.brand-text span{font-size:11px;color:var(--cian)}
.nav{flex:1;padding:10px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.7);cursor:pointer;font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--cian);color:#fff}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4);text-align:center;line-height:1.5}
.main{margin-left:260px;flex:1;min-height:100vh}
.header{background:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E0E7EF;position:sticky;top:0;z-index:50}
.header h2{font-size:18px;font-weight:700;color:var(--azul)}
.header-actions{display:flex;gap:10px;align-items:center}
.content{padding:22px 24px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--sombra);border-left:4px solid var(--cian)}
.kpi-card .label{font-size:12px;color:var(--suave);margin-bottom:4px}
.kpi-card .value{font-size:22px;font-weight:700;color:var(--azul)}
.kpi-card .sub{font-size:11px;color:var(--suave);margin-top:3px}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);overflow:hidden;margin-bottom:18px}
.panel-header{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E0E7EF}
.panel-header h3{font-size:14px;font-weight:650;color:var(--azul)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F8FAFC;text-align:left;padding:10px 12px;font-weight:600;color:var(--suave);font-size:11px;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid #EDF2F7}
tr:hover td{background:#F8FAFC}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--cian);color:#fff}.btn-primary:hover{background:var(--cian-oscuro)}
.btn-secondary{background:var(--azul);color:#fff}.btn-secondary:hover{background:#1A3D5C}
.btn-outline{background:transparent;border:1px solid #CBD5E0;color:var(--texto)}.btn-outline:hover{background:#F0F4F8}
.btn-danger{background:#FFF5F5;color:var(--rojo);border:1px solid #FED7D7}.btn-danger:hover{background:#FED7D7}
.btn-success{background:#E3F9E5;color:#0C6B58;border:1px solid #C6F6D5}.btn-success:hover{background:#C6F6D5}
.btn-sm{padding:4px 9px;font-size:11.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
label{font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase}
input,select,textarea{padding:8px 10px;border:1px solid #CBD5E0;border-radius:8px;font-size:13px;color:var(--texto);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cian);box-shadow:0 0 0 3px rgba(0,169,183,.15)}
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,47,.55);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-header{padding:14px 18px;border-bottom:1px solid #E0E7EF;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px;color:var(--azul)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--suave)}
.modal-footer{padding:12px 18px;border-top:1px solid #E0E7EF;display:flex;justify-content:flex-end;gap:8px}
.venta-overlay{position:fixed;inset:0;background:rgba(10,25,47,.4);display:none;z-index:250}
.venta-overlay.show{display:block}
.venta-modal{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:940px;max-width:96vw;max-height:calc(100vh - 50px);background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.venta-modal-header{padding:12px 18px;background:var(--azul);color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:move;user-select:none;flex-shrink:0}
.venta-modal-header h3{font-size:15px}
.venta-modal-body{flex:1;overflow-y:auto}
.venta-modal-footer{padding:10px 18px;border-top:1px solid #E0E7EF;display:flex;justify-content:flex-end;gap:8px;background:#F8FAFC;flex-shrink:0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#E3F9E5;color:#0C6B58}.badge-warning{background:#FFF8E6;color:#B44D12}.badge-danger{background:#FFF5F5;color:#C81E1E}.badge-info{background:#E3F8FF;color:#0A6C8C}
.empty{text-align:center;padding:36px 16px;color:var(--suave)}
.search-box{display:flex;align-items:center;gap:6px;background:#F0F4F8;border-radius:8px;padding:6px 11px;width:220px}
.search-box input{border:none;background:transparent;outline:none;font-size:12.5px;width:100%;padding:0}
.text-right{text-align:right}
.venta-items{padding:0 18px 10px}
.venta-item{display:grid;grid-template-columns:2fr 65px 85px 85px 32px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #EDF2F7;font-size:12.5px}
.totales-box{background:#F8FAFC;padding:12px 18px;border-top:1px solid #E0E7EF}
.totales-row{display:flex;justify-content:space-between;padding:2px 0;font-size:13px}
.totales-row.total{font-size:16px;font-weight:700;color:var(--azul);margin-top:4px;padding-top:6px;border-top:2px solid var(--cian)}
.logo-preview{width:80px;height:80px;border:2px dashed #CBD5E0;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#F8FAFC;cursor:pointer}
.logo-preview img{max-width:100%;max-height:100%;object-fit:contain}
.logo-preview span{font-size:11px;color:var(--suave);text-align:center;padding:6px}
.config-section{padding:18px;border-bottom:1px solid #EDF2F7}
.config-section h4{font-size:13px;color:var(--azul);margin-bottom:12px}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.two-cols{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{width:64px}.brand-text,.nav-item span{display:none}.main{margin-left:64px}.kpi-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.venta-modal{width:98vw;top:8px}}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}.no-print{display:none!important}}
.print-carta{width:210mm;min-height:270mm;padding:14mm 16mm;font-family:'Segoe UI',Arial,sans-serif;color:#222;background:#fff}
.print-pos{width:80mm;padding:6mm 5mm;font-family:'Courier New',monospace;font-size:11px;color:#111;background:#fff}
</style>
</head>
<body>

<div class="brand">

<div class="sidebar-footer"><strong id="footerEmpresa">LS Innovation</strong><br>Gestión Comercial · v1.1<br>lsinnovations.tech</div>

<div class="main no-print">
<header class="header">
<h2 id="pageTitle">Dashboard</h2>
<div class="header-actions">
