<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LS Gestión Comercial</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <style>
    :root {
      --azul: #102A43;
      --azul-oscuro: #0A192F;
      --cian: #00A9B7;
      --cian-oscuro: #087F8C;
      --gris-claro: #F0F4F8;
      --blanco: #FFFFFF;
      --texto: #243B53;
      --texto-suave: #627D98;
      --rojo: #E12D39;
      --verde: #27AB83;
      --sombra: 0 4px 12px rgba(16, 42, 67, 0.12);
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--gris-claro);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: var(--azul-oscuro);
      color: white;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .brand {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--cian), var(--azul));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--cian);
      font-weight: 500;
    }

    .nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
    .nav-item.active {
      background: var(--cian);
      color: white;
    }

    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }

    /* MAIN */
    .main {
      margin-left: 260px;
      flex: 1;
      min-height: 100vh;
    }

    .header {
      background: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E0E7EF;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--azul);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .content {
      padding: 28px 32px;
    }

    /* CARDS KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .kpi-card {
      background: white;
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--sombra);
      border-left: 4px solid var(--cian);
    }

    .kpi-card .label {
      font-size: 13px;
      color: var(--texto-suave);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .kpi-card .value {
      font-size: 26px;
      font-weight: 700;
      color: var(--azul);
    }

    .kpi-card .sub {
      font-size: 12px;
      color: var(--texto-suave);
      margin-top: 6px;
    }

    /* TABLES & PANELS */
    .panel {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--sombra);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .panel-header {
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E0E7EF;
    }

    .panel-header h3 {
      font-size: 16px;
      font-weight: 650;
      color: var(--azul);
    }

    .panel-body { padding: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    th {
      background: #F8FAFC;
      text-align: left;
      padding: 12px 16px;
      font-weight: 600;
      color: var(--texto-suave);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      padding: 13px 16px;
      border-top: 1px solid #EDF2F7;
      color: var(--texto);
    }

    tr:hover td { background: #F8FAFC; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--cian);
      color: white;
    }
    .btn-primary:hover { background: var(--cian-oscuro); }

    .btn-secondary {
      background: var(--azul);
      color: white;
    }
    .btn-secondary:hover { background: #1A3D5C; }

    .btn-outline {
      background: transparent;
      border: 1px solid #CBD5E0;
      color: var(--texto);
    }
    .btn-outline:hover { background: #F0F4F8; }

    .btn-danger {
      background: #FFF5F5;
      color: var(--rojo);
      border: 1px solid #FED7D7;
    }
    .btn-danger:hover { background: #FED7D7; }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* FORMS */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    input, select, textarea {
      padding: 10px 12px;
      border: 1px solid #CBD5E0;
      border-radius: 8px;
      font-size: 14px;
      color: var(--texto);
      background: white;
      transition: border 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--cian);
      box-shadow: 0 0 0 3px rgba(0, 169, 183, 0.15);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 47, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: white;
      border-radius: 16px;
      width: 520px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid #E0E7EF;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 { font-size: 17px; color: var(--azul); }

    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--texto-suave);
      line-height: 1;
    }

    .modal-footer {
      padding: 16px 22px;
      border-top: 1px solid #E0E7EF;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* BADGES */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success { background: #E3F9E5; color: #0C6B58; }
    .badge-warning { background: #FFF8E6; color: #B44D12; }
    .badge-danger  { background: #FFF5F5; color: #C81E1E; }
    .badge-info    { background: #E3F8FF; color: #0A6C8C; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--texto-suave);
    }

    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

    /* SEARCH */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F0F4F8;
      border-radius: 8px;
      padding: 8px 14px;
      width: 260px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      width: 100%;
      padding: 0;
    }

    /* UTILITIES */
    .hidden { display: none !important; }
    .text-right { text-align: right; }
    .text-cian { color: var(--cian); }
    .mt-16 { margin-top: 16px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* VENTA DETALLE */
    .venta-items {
      padding: 0 22px 16px;
    }

    .venta-item {
      display: grid;
      grid-template-columns: 2fr 80px 100px 100px 40px;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #EDF2F7;
    }

    .totales-box {
      background: #F8FAFC;
      padding: 16px 22px;
      border-top: 1px solid #E0E7EF;
    }

    .totales-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 14px;
    }

    .totales-row.total {
      font-size: 18px;
      font-weight: 700;
      color: var(--azul);
      margin-top: 8px;
      padding-top: 10px;
      border-top: 2px solid var(--cian);
    }

    /* RESPONSIVE */
    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .brand-text, .nav-item span { display: none; }
      .main { margin-left: 70px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">LS</div>
      <div class="brand-text">
        <h1>LS Gestión</h1>
        <span>Comercial</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-page="dashboard">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-page="clientes">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span>Clientes</span>
      </button>
      <button class="nav-item" data-page="productos">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Productos</span>
      </button>
      <button class="nav-item" data-page="ventas">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        <span>Ventas</span>
      </button>
      <button class="nav-item" data-page="reportes">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Reportes</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      LS Innovation © 2026<br>
      Versión Demo 1.0
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">
    <header class="header">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="header-actions">
        <div class="search-box" id="searchBox" style="display:none;">
          <svg width="16" height="16" fill="none" stroke="#627D98" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar..." />
        </div>
        <button class="btn btn-primary" id="btnNuevo" style="display:none;" onclick="abrirModalNuevo()">
          + Nuevo
        </button>
      </div>
    </header>

    <div class="content" id="content">
      <!-- Se renderiza dinámicamente -->
    </div>
  </div>

  <!-- MODAL GENÉRICO -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Nuevo</h3>
        <button class="modal-close" onclick="cerrarModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

<script>
// ============================================================
// LS GESTIÓN COMERCIAL - Versión Demo
// ============================================================

const STORAGE_KEY = 'ls_gestion_comercial_v1';

// ---------- DATOS DEMO ----------
const DEMO_DATA = {
  clientes: [
    { id: 1, nombre: 'Comercializadora del Norte SA', rfc: 'CNO850101ABC', telefono: '555-0101', email: 'contacto@cdnorte.com', direccion: 'Av. Reforma 120, CDMX' },
    { id: 2, nombre: 'Distribuidora Pacífico', rfc: 'DPA920315XYZ', telefono: '555-0202', email: 'ventas@dpacifico.mx', direccion: 'Calle Marina 45, Guadalajara' },
    { id: 3, nombre: 'Servicios Industriales López', rfc: 'SIL880720QWE', telefono: '555-0303', email: 'info@silopez.com', direccion: 'Parque Industrial 8, Monterrey' },
  ],
  productos: [
    { id: 1, codigo: 'PROD-001', nombre: 'Laptop Pro 15"', categoria: 'Electrónica', precio: 18500, costo: 12000, stock: 15 },
    { id: 2, codigo: 'PROD-002', nombre: 'Monitor 27" 4K', categoria: 'Electrónica', precio: 7200, costo: 4800, stock: 22 },
    { id: 3, codigo: 'PROD-003', nombre: 'Teclado Mecánico RGB', categoria: 'Accesorios', precio: 1450, costo: 780, stock: 40 },
    { id: 4, codigo: 'PROD-004', nombre: 'Mouse Inalámbrico', categoria: 'Accesorios', precio: 450, costo: 220, stock: 3 },
    { id: 5, codigo: 'PROD-005', nombre: 'Impresora Láser', categoria: 'Oficina', precio: 5600, costo: 3400, stock: 8 },
  ],
  ventas: [
    {
      id: 1,
      numero: 'VTA-2026-0001',
      clienteId: 1,
      fecha: '2026-09-10',
      estado: 'Confirmada',
      items: [
        { productoId: 1, cantidad: 2, precio: 18500 },
        { productoId: 3, cantidad: 3, precio: 1450 }
      ]
    },
    {
      id: 2,
      numero: 'VTA-2026-0002',
      clienteId: 2,
      fecha: '2026-09-11',
      estado: 'Confirmada',
      items: [
        { productoId: 2, cantidad: 4, precio: 7200 }
      ]
    },
    {
      id: 3,
      numero: 'VTA-2026-0003',
      clienteId: 3,
      fecha: '2026-09-12',
      estado: 'Borrador',
      items: [
        { productoId: 5, cantidad: 1, precio: 5600 },
        { productoId: 4, cantidad: 5, precio: 450 }
      ]
    }
  ],
  config: {
    tasaImpuesto: 0.16,
    simboloMoneda: '$',
    nombreEmpresa: 'LS Innovation'
  },
  nextIds: { cliente: 4, producto: 6, venta: 4 }
};

// ---------- STORAGE ----------
function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_DATA));
    return structuredClone(DEMO_DATA);
  }
  return JSON.parse(raw);
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let DB = loadData();

// ---------- HELPERS ----------
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function money(n) {
  return DB.config.simboloMoneda + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function calcVentaTotal(venta) {
  const sub = venta.items.reduce((s, i) => s + i.cantidad * i.precio, 0);
  const imp = sub * DB.config.tasaImpuesto;
  return { subtotal: sub, impuesto: imp, total: sub + imp };
}

function getCliente(id) {
  return DB.clientes.find(c => c.id === id) || { nombre: '—' };
}

function getProducto(id) {
  return DB.productos.find(p => p.id === id) || { nombre: '—', stock: 0 };
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `
    position:fixed; bottom:24px; right:24px; z-index:999;
    background:${type==='error'? '#E12D39': type==='success'? '#27AB83': '#102A43'};
    color:white; padding:12px 20px; border-radius:8px; font-size:13px;
    box-shadow:0 4px 16px rgba(0,0,0,0.2); animation: fadeIn 0.3s;
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ---------- NAVEGACIÓN ----------
let currentPage = 'dashboard';

$$('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    render();
  });
});

function render() {
  const titles = {
    dashboard: 'Dashboard',
    clientes: 'Clientes',
    productos: 'Productos',
    ventas: 'Ventas',
    reportes: 'Reportes'
  };
  $('#pageTitle').textContent = titles[currentPage];

  const showNew = ['clientes', 'productos', 'ventas'].includes(currentPage);
  $('#btnNuevo').style.display = showNew ? 'inline-flex' : 'none';
  $('#searchBox').style.display = showNew ? 'flex' : 'none';
  $('#searchInput').value = '';

  const pages = { dashboard: renderDashboard, clientes: renderClientes, productos: renderProductos, ventas: renderVentas, reportes: renderReportes };
  pages[currentPage]();
}

// ---------- DASHBOARD ----------
function renderDashboard() {
  const hoy = new Date().toISOString().slice(0, 10);
  const inicioMes = hoy.slice(0, 8) + '01';

  const ventasConfirmadas = DB.ventas.filter(v => v.estado === 'Confirmada');
  const ventasHoy = ventasConfirmadas.filter(v => v.fecha === hoy);
  const ventasMes = ventasConfirmadas.filter(v => v.fecha >= inicioMes);

  const totalHoy = ventasHoy.reduce((s, v) => s + calcVentaTotal(v).total, 0);
  const totalMes = ventasMes.reduce((s, v) => s + calcVentaTotal(v).total, 0);
  const stockBajo = DB.productos.filter(p => p.stock < 5).length;

  $('#content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="label">Ventas de Hoy</div>
        <div class="value">${money(totalHoy)}</div>
        <div class="sub">${ventasHoy.length} venta(s)</div>
      </div>
      <div class="kpi-card">
        <div class="label">Ventas del Mes</div>
        <div class="value">${money(totalMes)}</div>
        <div class="sub">${ventasMes.length} venta(s)</div>
      </div>
      <div class="kpi-card">
        <div class="label">Total Clientes</div>
        <div class="value">${DB.clientes.length}</div>
        <div class="sub">registrados</div>
      </div>
      <div class="kpi-card" style="border-left-color:${stockBajo > 0 ? 'var(--rojo)' : 'var(--cian)'}">
        <div class="label">Stock Bajo</div>
        <div class="value" style="color:${stockBajo > 0 ? 'var(--rojo)' : 'var(--azul)'}">${stockBajo}</div>
        <div class="sub">productos con menos de 5</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h3>Últimas Ventas</h3>
        <button class="btn btn-sm btn-outline" onclick="$$('.nav-item')[3].click()">Ver todas</button>
      </div>
      <div class="panel-body">
        <table>
          <thead>
            <tr>
              <th>Número</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${DB.ventas.slice().reverse().slice(0, 5).map(v => {
              const t = calcVentaTotal(v);
              const badge = v.estado === 'Confirmada' ? 'badge-success' : v.estado === 'Borrador' ? 'badge-warning' : 'badge-danger';
              return `<tr>
                <td><strong>${v.numero}</strong></td>
                <td>${getCliente(v.clienteId).nombre}</td>
                <td>${v.fecha}</td>
                <td><span class="badge ${badge}">${v.estado}</span></td>
                <td class="text-right">${money(t.total)}</td>
              </tr>`;
            }).join('') || '<tr><td colspan="5" class="empty">No hay ventas aún</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h3>Productos con Stock Bajo</h3></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Código</th><th>Producto</th><th>Stock</th><th class="text-right">Precio</th></tr></thead>
          <tbody>
            ${DB.productos.filter(p => p.stock < 5).map(p => `
              <tr>
                <td>${p.codigo}</td>
                <td>${p.nombre}</td>
                <td><span class="badge badge-danger">${p.stock}</span></td>
                <td class="text-right">${money(p.precio)}</td>
              </tr>
            `).join('') || '<tr><td colspan="4" class="empty">Todo el stock está bien ✅</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------- CLIENTES ----------

  const lista = DB.clientes.filter(c =>
    c.nombre.toLowerCase().includes(filtro) ||
    (c.rfc || '').toLowerCase().includes(filtro) ||
    (c.email || '').toLowerCase().includes(filtro)
  );

  $('#content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <h3>${lista.length} cliente(s)</h3>
      </div>
      <div class="panel-body">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>RFC / NIT</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(c => `
              <tr>
                <td><strong>${c.nombre}</strong></td>
                <td>${c.rfc || '—'}</td>
                <td>${c.telefono || '—'}</td>
                <td>${c.email || '—'}</td>
                <td>
                  <button class="btn btn-sm btn-outline" onclick="editarCliente(${c.id})">Editar</button>
                  <button class="btn btn-sm btn-danger" onclick="eliminarCliente(${c.id})">Eliminar</button>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="5" class="empty">No hay clientes</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------- PRODUCTOS ----------
function renderProductos(filtro = '') {
  const lista = DB.productos.filter(p =>
    p.nombre.toLowerCase().includes(filtro) ||
    p.codigo.toLowerCase().includes(filtro) ||
    (p.categoria || '').toLowerCase().includes(filtro)
  );

  $('#content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <h3>${lista.length} producto(s)</h3>
      </div>
      <div class="panel-body">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th class="text-right">Precio</th>
              <th class="text-right">Stock</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(p => `
              <tr>
                <td>${p.codigo}</td>
                <td><strong>${p.nombre}</strong></td>

                <td class="text-right">${money(p.precio)}</td>
                <td class="text-right">
                  <span class="badge ${p.stock < 5 ? 'badge-danger' : p.stock < 10 ? 'badge-warning' : 'badge-success'}">${p.stock}</span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline" onclick="editarProducto(${p.id})">Editar</button>

          </tbody>

      </div>
    </div>

}

// ---------- VENTAS ----------
function renderVentas(filtro = '') {
  const lista = DB.ventas.filter(v =>
    v.numero.toLowerCase().includes(filtro) ||
    getCliente(v.clienteId).nombre.toLowerCase().includes(filtro)
  ).slice().reverse();

  $('#content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <h3>${lista.length} venta(s)</h3>
      </div>
      <div class="panel-body">
        <table>
          <thead>
            <tr>
              <th>Número</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th class="text-right">Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(v => {
              const t = calcVentaTotal(v);
              const badge = v.estado === 'Confirmada' ? 'badge-success' : v.estado === 'Borrador' ? 'badge-warning' : 'badge-danger';
              return `<tr>
                <td><strong>${v.numero}</strong></td>
                <td>${getCliente(v.clienteId).nombre}</td>
                <td>${v.fecha}</td>
                <td><span class="badge ${badge}">${v.estado}</span></td>
                <td class="text-right">${money(t.total)}</td>
                <td>
                  <button class="btn btn-sm btn-outline" onclick="verVenta(${v.id})">Ver</button>
                  ${v.estado === 'Borrador' ? `<button class="btn btn-sm btn-primary" onclick="confirmarVenta(${v.id})">Confirmar</button>` : ''}
                  ${v.estado === 'Borrador' ? `<button class="btn btn-sm btn-danger" onclick="eliminarVenta(${v.id})">Eliminar</button>` : ''}
                </td>
              </tr>`;
            }).join('') || '<tr><td colspan="6" class="empty">No hay ventas</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------- REPORTES ----------
function renderReportes() {
  const confirmadas = DB.ventas.filter(v => v.estado === 'Confirmada');
  const porCliente = {};
  confirmadas.forEach(v => {
    const nom = getCliente(v.clienteId).nombre;
    porCliente[nom] = (porCliente[nom] || 0) + calcVentaTotal(v).total;
  });

  const porProducto = {};
  confirmadas.forEach(v => {
    v.items.forEach(i => {
      const nom = getProducto(i.productoId).nombre;
      porProducto[nom] = (porProducto[nom] || 0) + i.cantidad;
    });
  });

  $('#content').innerHTML = `
    <div class="kpi-grid" style="grid-template-columns: repeat(3,1fr);">
      <div class="kpi-card">
        <div class="label">Total Vendido (histórico)</div>
        <div class="value">${money(confirmadas.reduce((s,v) => s + calcVentaTotal(v).total, 0))}</div>
      </div>
      <div class="kpi-card">
        <div class="label">Ventas Confirmadas</div>
        <div class="value">${confirmadas.length}</div>
      </div>
      <div class="kpi-card">
        <div class="label">Ticket Promedio</div>
        <div class="value">${money(confirmadas.length ? confirmadas.reduce((s,v) => s + calcVentaTotal(v).total, 0) / confirmadas.length : 0)}</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
      <div class="panel">
        <div class="panel-header"><h3>Ventas por Cliente</h3></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Cliente</th><th class="text-right">Total</th></tr></thead>
            <tbody>
              ${Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).map(([n,t]) => `
                <tr><td>${n}</td><td class="text-right">${money(t)}</td></tr>
              `).join('') || '<tr><td colspan="2" class="empty">Sin datos</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Productos más Vendidos</h3></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Producto</th><th class="text-right">Cantidad</th></tr></thead>
            <tbody>
              ${Object.entries(porProducto).sort((a,b)=>b[1]-a[1]).map(([n,c]) => `
                <tr><td>${n}</td><td class="text-right">${c}</td></tr>
              `).join('') || '<tr><td colspan="2" class="empty">Sin datos</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

// ---------- MODALES ----------
function abrirModal(titulo, bodyHtml, footerHtml) {
  $('#modalTitle').textContent = titulo;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFooter').innerHTML = footerHtml;
  $('#modalOverlay').classList.add('show');
}

function cerrarModal() {
  $('#modalOverlay').classList.remove('show');
}

function abrirModalNuevo() {
  if (currentPage === 'clientes') formCliente();
  else if (currentPage === 'productos') formProducto();
  else if (currentPage === 'ventas') formVenta();
}

// --- Cliente ---
function formCliente(cliente = null) {
  const c = cliente || { nombre:'', rfc:'', telefono:'', email:'', direccion:'' };
  abrirModal(cliente ? 'Editar Cliente' : 'Nuevo Cliente', `
    <div class="form-grid">
      <div class="form-group full">
        <label>Nombre / Razón Social *</label>
        <input id="f_nombre" value="${c.nombre}" />
      </div>
      <div class="form-group">
        <label>RFC / NIT</label>
        <input id="f_rfc" value="${c.rfc || ''}" />
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input id="f_telefono" value="${c.telefono || ''}" />
      </div>
      <div class="form-group full">
        <label>Email</label>
        <input id="f_email" type="email" value="${c.email || ''}" />
      </div>
      <div class="form-group full">
        <label>Dirección</label>
        <input id="f_direccion" value="${c.direccion || ''}" />
      </div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarCliente(${cliente ? cliente.id : 'null'})">Guardar</button>
  `);
}

function guardarCliente(id) {
  const nombre = $('#f_nombre').value.trim();
  if (!nombre) return toast('El nombre es obligatorio', 'error');

  if (id) {
    const c = DB.clientes.find(x => x.id === id);
    Object.assign(c, {
      nombre,
      rfc: $('#f_rfc').value.trim(),
      telefono: $('#f_telefono').value.trim(),
      email: $('#f_email').value.trim(),
      direccion: $('#f_direccion').value.trim()
    });
  } else {
    DB.clientes.push({
      id: DB.nextIds.cliente++,
      nombre,
      rfc: $('#f_rfc').value.trim(),
      telefono: $('#f_telefono').value.trim(),
      email: $('#f_email').value.trim(),
      direccion: $('#f_direccion').value.trim()
    });
  }
  saveData(DB);
  cerrarModal();
  render();
  toast('Cliente guardado', 'success');
}

function editarCliente(id) {
  formCliente(DB.clientes.find(c => c.id === id));
}

function eliminarCliente(id) {
  if (!confirm('¿Eliminar este cliente?')) return;
  DB.clientes = DB.clientes.filter(c => c.id !== id);
  saveData(DB);
  render();
  toast('Cliente eliminado', 'success');
}

// --- Producto ---
function formProducto(prod = null) {
  const p = prod || { codigo:'', nombre:'', categoria:'', precio:0, costo:0, stock:0 };
  abrirModal(prod ? 'Editar Producto' : 'Nuevo Producto', `
    <div class="form-grid">
      <div class="form-group">
        <label>Código *</label>
        <input id="f_codigo" value="${p.codigo}" />
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <input id="f_categoria" value="${p.categoria || ''}" />
      </div>
      <div class="form-group full">
        <label>Nombre *</label>
        <input id="f_nombre" value="${p.nombre}" />
      </div>
      <div class="form-group">
        <label>Precio de Venta *</label>
        <input id="f_precio" type="number" step="0.01" value="${p.precio}" />
      </div>
      <div class="form-group">
        <label>Costo</label>
        <input id="f_costo" type="number" step="0.01" value="${p.costo || 0}" />
      </div>
      <div class="form-group">
        <label>Stock</label>
        <input id="f_stock" type="number" value="${p.stock}" />
      </div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarProducto(${prod ? prod.id : 'null'})">Guardar</button>
  `);
}

function guardarProducto(id) {
  const nombre = $('#f_nombre').value.trim();
  const codigo = $('#f_codigo').value.trim();
  if (!nombre || !codigo) return toast('Código y nombre son obligatorios', 'error');

  const data = {
    codigo,
    nombre,
    categoria: $('#f_categoria').value.trim(),
    precio: parseFloat($('#f_precio').value) || 0,
    costo: parseFloat($('#f_costo').value) || 0,
    stock: parseInt($('#f_stock').value) || 0
  };

  if (id) {
    Object.assign(DB.productos.find(x => x.id === id), data);
  } else {
    DB.productos.push({ id: DB.nextIds.producto++, ...data });
  }
  saveData(DB);
  cerrarModal();
  render();
  toast('Producto guardado', 'success');
}

function editarProducto(id) {
  formProducto(DB.productos.find(p => p.id === id));
}

function eliminarProducto(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  DB.productos = DB.productos.filter(p => p.id !== id);
  saveData(DB);
  render();
  toast('Producto eliminado', 'success');
}

// --- Venta ---
let ventaTemp = null;

function formVenta() {
  ventaTemp = {
    clienteId: '',
    fecha: new Date().toISOString().slice(0, 10),
    items: []
  };
  renderFormVenta();
}

function renderFormVenta() {
  const itemsHtml = ventaTemp.items.map((item, idx) => {
    const p = getProducto(item.productoId);
    return `
      <div class="venta-item">
        <div>${p.nombre}</div>
        <div>${item.cantidad}</div>
        <div>${money(item.precio)}</div>
        <div>${money(item.cantidad * item.precio)}</div>
        <button class="btn btn-sm btn-danger" onclick="quitarItemVenta(${idx})">×</button>
      </div>
    `;
  }).join('');

  const sub = ventaTemp.items.reduce((s, i) => s + i.cantidad * i.precio, 0);
  const imp = sub * DB.config.tasaImpuesto;
  const tot = sub + imp;

  abrirModal('Nueva Venta', `
    <div class="form-grid">
      <div class="form-group">
        <label>Cliente *</label>
        <select id="f_cliente">
          <option value="">Seleccionar...</option>
          ${DB.clientes.map(c => `<option value="${c.id}" ${ventaTemp.clienteId == c.id ? 'selected' : ''}>${c.nombre}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input id="f_fecha" type="date" value="${ventaTemp.fecha}" />
      </div>
    </div>

    <div style="padding:0 22px 8px; display:flex; gap:10px; align-items:flex-end;">
      <div class="form-group" style="flex:2">
        <label>Producto</label>
        <select id="f_producto">
          <option value="">Seleccionar producto...</option>
          ${DB.productos.map(p => `<option value="${p.id}">${p.codigo} - ${p.nombre} (Stock: ${p.stock})</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="width:90px">
        <label>Cant.</label>
        <input id="f_cant" type="number" min="1" value="1" />
      </div>
      <button class="btn btn-secondary" onclick="agregarItemVenta()" style="margin-bottom:1px">Agregar</button>
    </div>

    <div class="venta-items">
      <div class="venta-item" style="font-weight:600; font-size:12px; color:var(--texto-suave);">
        <div>Producto</div><div>Cant.</div><div>Precio</div><div>Subtotal</div><div></div>
      </div>
      ${itemsHtml || '<div style="padding:16px; color:#999; text-align:center;">Sin productos agregados</div>'}
    </div>

    <div class="totales-box">
      <div class="totales-row"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="totales-row"><span>Impuesto (${(DB.config.tasaImpuesto*100).toFixed(0)}%)</span><span>${money(imp)}</span></div>
      <div class="totales-row total"><span>Total</span><span>${money(tot)}</span></div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarVenta()">Guardar Borrador</button>
  `);
}

function agregarItemVenta() {
  const pid = parseInt($('#f_producto').value);
  const cant = parseInt($('#f_cant').value) || 1;
  if (!pid) return toast('Selecciona un producto', 'error');

  const prod = getProducto(pid);
  if (cant > prod.stock) return toast(`Stock insuficiente. Disponible: ${prod.stock}`, 'error');

  const exist = ventaTemp.items.find(i => i.productoId === pid);
  if (exist) {
    if (exist.cantidad + cant > prod.stock) return toast('Stock insuficiente', 'error');
    exist.cantidad += cant;
  } else {
    ventaTemp.items.push({ productoId: pid, cantidad: cant, precio: prod.precio });
  }
  ventaTemp.clienteId = $('#f_cliente').value;
  ventaTemp.fecha = $('#f_fecha').value;
  renderFormVenta();
}

function quitarItemVenta(idx) {
  ventaTemp.items.splice(idx, 1);
  renderFormVenta();
}

function guardarVenta() {
  const clienteId = parseInt($('#f_cliente').value);
  if (!clienteId) return toast('Selecciona un cliente', 'error');
  if (ventaTemp.items.length === 0) return toast('Agrega al menos un producto', 'error');

  const year = new Date().getFullYear();
  const num = DB.nextIds.venta;
  const numero = `VTA-${year}-${String(num).padStart(4, '0')}`;

  DB.ventas.push({
    id: DB.nextIds.venta++,
    numero,
    clienteId,
    fecha: $('#f_fecha').value,
    estado: 'Borrador',
    items: ventaTemp.items
  });

  saveData(DB);
  cerrarModal();
  render();
  toast('Venta guardada como borrador', 'success');
}

function confirmarVenta(id) {
  const venta = DB.ventas.find(v => v.id === id);
  if (!venta || venta.estado !== 'Borrador') return;

  for (const item of venta.items) {
    const prod = getProducto(item.productoId);
    if (item.cantidad > prod.stock) {
      return toast(`Stock insuficiente de ${prod.nombre}`, 'error');
    }
  }

  venta.items.forEach(item => {
    const prod = DB.productos.find(p => p.id === item.productoId);
    if (prod) prod.stock -= item.cantidad;
  });

  venta.estado = 'Confirmada';
  saveData(DB);
  render();
  toast('Venta confirmada y stock actualizado', 'success');
}

function verVenta(id) {
  const v = DB.ventas.find(x => x.id === id);
  if (!v) return;
  const t = calcVentaTotal(v);

  abrirModal(`Venta ${v.numero}`, `
    <div style="padding:20px 22px;">
      <p><strong>Cliente:</strong> ${getCliente(v.clienteId).nombre}</p>
      <p><strong>Fecha:</strong> ${v.fecha}</p>
      <p><strong>Estado:</strong> <span class="badge ${v.estado==='Confirmada'?'badge-success':'badge-warning'}">${v.estado}</span></p>
      <hr style="margin:16px 0; border:none; border-top:1px solid #E0E7EF;">
      <table>
        <thead><tr><th>Producto</th><th>Cant.</th><th class="text-right">Precio</th><th class="text-right">Subtotal</th></tr></thead>
        <tbody>
          ${v.items.map(i => `
            <tr>
              <td>${getProducto(i.productoId).nombre}</td>
              <td>${i.cantidad}</td>
              <td class="text-right">${money(i.precio)}</td>
              <td class="text-right">${money(i.cantidad * i.precio)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="totales-box" style="margin-top:12px; border-radius:8px;">
        <div class="totales-row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
        <div class="totales-row"><span>Impuesto</span><span>${money(t.impuesto)}</span></div>
        <div class="totales-row total"><span>Total</span><span>${money(t.total)}</span></div>
      </div>
    </div>
  `, `<button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button>`);
}

function eliminarVenta(id) {
  if (!confirm('¿Eliminar esta venta en borrador?')) return;
  DB.ventas = DB.ventas.filter(v => v.id !== id);
  saveData(DB);
  render();
  toast('Venta eliminada', 'success');
}

// ---------- BÚSQUEDA ----------
$('#searchInput').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  if (currentPage === 'clientes') renderClientes(q);
  else if (currentPage === 'productos') renderProductos(q);
  else if (currentPage === 'ventas') renderVentas(q);
});

// ---------- INICIO ----------
render();
</script>
</body>
</html>
